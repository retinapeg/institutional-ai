[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "institutional-ai"
version = "0.1.0"
description = "Persistent specialist organisations with governed, inspectable AI work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Institutional AI contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
institutional-ai = "institutional_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_ai"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["institutional_ai"]

